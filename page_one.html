<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Detail</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f9fafb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .product-page {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 3rem;
      color: #ec5718;
      margin-bottom: 10px;
      font-weight: 700;
    }

    header .stat {
      font-size: 1.4rem;
      color: #6b7280;
    }

    .orange-bold {
        color: #ec5718;   /* orange */
        font-weight: 700;  /* bold */
    }


    .reviews {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .review-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .review-card .user {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1f2937;
    }

    .review-card .text {
      font-size: 0.9rem;
      color: #374151;
      flex: 1;
      overflow: auto;
    }

    .review-card .images {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .review-card .images div {
      flex: 1 1 48%;
      height: 80px;
      background: #f3f4f6;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .review-card .images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .review-card .likes {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .review-card .likes span {
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .review-card .likes span:hover {
      color: #ec5718;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="product-page">
    <header>
      <h1 id="productTitle">iPhone 16</h1>
      <p class="stat">
        <span class="orange-bold">35%</span> of reviews detected at 
        <span class="orange-bold">AI</span> or 
        <span class="orange-bold">Sponsored</span>. Don't worry, we have removed them for you! 📊 📈
      </p>
      
      
     
    </header>

    <main>
      <section class="reviews" id="reviewsList">
        <!-- Review tiles injected here -->
      </section>
    </main>

    <footer>© 2025 True View</footer>
  </div>

  <script>
    // 🖼️ Add your JPG paths in the "images" arrays.
    // Place these files in an /images folder next to this HTML file.
    const REVIEWS = [
      {
        user: 'Anna',
        text: 'This phone is amazing! The camera is superb.',
        up: 12,
        down: 1,
        images: ['images/phone1.jpg', 'images/phone3.jpg']
      },
      {
        user: 'User101',
        text: 'Battery life could be better, but overall satisfied.',
        up: 7,
        down: 2,
        images: []
      },

      {
        user: 'User33',
        text: 'NOT WORTH IT, IT BROKE',
        up: 3,
        down: 8,
        images: ['images/broken.jpg', 'images/video2.jpg', 'images/video.jpg']
      },
     
      {
        user: 'Dana',
        text: 'The screen is bright and clear, very happy!',
        up: 9,
        down: 1,
        images: []
      },

      {
        user: 'Hannah',
        text: 'Fantastic performance, very smooth.',
        up: 15,
        down: 0,
        images: ['images/phone2.jpg']
      },
    
      {
        user: 'Frank',
        text: 'Good value for money.',
        up: 6,
        down: 0,
        images: []
      },
      {
        user: 'Grace',
        text: 'Sleek design, works well.',
        up: 10,
        down: 2,
        images: []
      }
    ];

    const reviewsList = document.getElementById('reviewsList');

    function renderReviews() {
      reviewsList.innerHTML = '';
      REVIEWS.forEach((r, index) => {
        const card = document.createElement('div');
        card.className = 'review-card';

        let imagesHTML = '';
        if (r.images.length > 0) {
          imagesHTML = `<div class="images">`;
          r.images.forEach(img => {
            imagesHTML += `
              <div>
                <img src="${img}" alt="Review image">
              </div>`;
          });
          imagesHTML += `</div>`;
        }

        card.innerHTML = `
          <div class="user">${r.user}</div>
          <div class="text">${r.text}</div>
          ${imagesHTML}
          <div class="likes">
            <span id="up-${index}">👍 ${r.up}</span>
            <span id="down-${index}">👎 ${r.down}</span>
          </div>
        `;
        reviewsList.appendChild(card);

        document.getElementById(`up-${index}`).addEventListener('click', () => {
          r.up++;
          renderReviews();
        });

        document.getElementById(`down-${index}`).addEventListener('click', () => {
          r.down++;
          renderReviews();
        });
      });
    }

    renderReviews();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CritiqueHub — Reviews</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --accent: #3b82f6;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--accent);
      font-weight: 700;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      box-shadow: var(--shadow);
      width: 60%;
    }

    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      padding: 6px;
    }

    .search-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .search-btn:hover {
      background: #2563eb;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .profile-menu {
      position: absolute;
      right: 0;
      top: 55px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: none;
    }

    .profile-menu.active {
      display: block;
    }

    .profile-menu button {
      background: none;
      border: none;
      width: 100%;
      padding: 10px 16px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
    }

    .profile-menu button:hover {
      background: #f3f4f6;
    }

    .genres {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .genre {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .genre:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .genre.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .genre .title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .genre .count {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin: 0 0 8px 0;
      color: var(--text);
    }

    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rating {
      background: #f3f4f6;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: var(--accent);
    }

    footer {
      text-align: center;
      color: var(--muted);
      margin-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <h1>CritiqueHub</h1>
      </div>
      <div class="search-wrap">
        <input id="searchInput" placeholder="Search reviews..." />
        <button class="search-btn" id="searchBtn">Search</button>
      </div>
      <div class="profile">
        <div id="avatarBtn" class="avatar">A</div>
        <div id="profileMenu" class="profile-menu">
          <button>My Profile</button>
          <button>Settings</button>
          <button>Log Out</button>
        </div>
      </div>
    </header>

    <main>
      <section class="genres" id="genresList"></section>
      <section id="results"></section>
      <footer>© 2025 CritiqueHub — Modern Review Platform</footer>
    </main>
  </div>

  <script>
    const REVIEWS = [
      {id:1,title:'Nebula Nights',author:'R. Vega',genre:'Sci-Fi',rating:4.5,excerpt:'A luminous journey through a broken star system.'},
      {id:2,title:'Cup of Dawn',author:'M. Chen',genre:'Romance',rating:4.1,excerpt:'Warm, quiet and full of gentle humor.'},
      {id:3,title:'The Last Codex',author:'A. Ortega',genre:'Fantasy',rating:4.8,excerpt:'Epic worldbuilding with a tender core.'},
      {id:4,title:'Modern Atlas',author:'L. Singh',genre:'Nonfiction',rating:4.0,excerpt:'Sharp reporting on cities reimagined.'},
      {id:5,title:'Pixel Revolt',author:'K. Anders',genre:'Gaming',rating:3.9,excerpt:'A frantic but flawed indie with heart.'},
      {id:6,title:'Quiet Harbor',author:'T. Haynes',genre:'Mystery',rating:4.3,excerpt:'Slow-burn tension and satisfying reveals.'}
    ];

    const genreCounts = REVIEWS.reduce((acc, r) => {
      acc[r.genre] = (acc[r.genre] || 0) + 1;
      return acc;
    }, {});

    const genres = Object.keys(genreCounts);
    const genresList = document.getElementById('genresList');
    const resultsEl = document.getElementById('results');

    function renderGenres() {
      genresList.innerHTML = '';
      const allBox = makeGenreBox('All', REVIEWS.length);
      allBox.classList.add('active');
      genresList.appendChild(allBox);
      genres.forEach(g => genresList.appendChild(makeGenreBox(g, genreCounts[g])));
    }

    function makeGenreBox(name, count) {
      const el = document.createElement('div');
      el.className = 'genre';
      el.innerHTML = `<div class="title">${name}</div><div class="count">${count} reviews</div>`;
      el.addEventListener('click', () => {
        document.querySelectorAll('.genre').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        applyFilter(name === 'All' ? null : name);
      });
      return el;
    }

    function renderResults(list) {
      resultsEl.innerHTML = '';
      if (list.length === 0) {
        resultsEl.innerHTML = '<p>No reviews found.</p>';
        return;
      }
      list.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${r.title}</h3><div class="meta"><div class="rating">★ ${r.rating}</div><div>${r.genre} — by ${r.author}</div></div><p>${r.excerpt}</p>`;
        resultsEl.appendChild(card);
      });
    }

    function applyFilter(genre = null) {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = REVIEWS.filter(r => {
        const matchesQuery = !query || r.title.toLowerCase().includes(query) || r.author.toLowerCase().includes(query);
        const matchesGenre = !genre || r.genre === genre;
        return matchesQuery && matchesGenre;
      });
      renderResults(filtered);
    }

    document.getElementById('searchBtn').addEventListener('click', () => applyFilter());
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });

    document.getElementById('avatarBtn').addEventListener('click', () => {
      document.getElementById('profileMenu').classList.toggle('active');
    });

    renderGenres();
    renderResults(REVIEWS);
  </script>
</body>
</html>
